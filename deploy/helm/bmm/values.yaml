image:
  repository: ghcr.io/baakhoff/bmm
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

config:
  # The address people open BMM at, e.g. https://bmm.example.com.
  # Defaults to the ingress host when ingress is enabled.
  publicUrl: ""
  # BMM is normally reached through an ingress controller, which sets
  # X-Forwarded-*. Turn off if the Service is exposed directly.
  trustProxy: true
  passwordLogin: true
  # If set, creating the first admin requires this value.
  setupToken: ""
  # Encrypts the networks' credentials in the database. Leave empty to have
  # one generated and kept across upgrades; with Argo CD set it, or name a
  # Secret you manage (key: secret-key). Back it up with the database: without
  # it every account has to be connected again.
  secretKey: ""
  secretKeyExistingSecret: ""
  # Ask GitHub a few times a day whether a newer release exists, and say so in
  # the UI. Nothing about the instance is sent.
  updateCheck: true
  logLevel: info

# Instagram downloads images from a public https address instead of accepting
# uploads. Only /public/ needs to be reachable there; it serves signed,
# expiring links to single images. See docs/public-media.md.
publicMedia:
  # The public address, e.g. https://media.example.com. Empty: Instagram
  # cannot publish; everything else works.
  url: ""
  # Option 1: a second Ingress that exposes only /public/ on a public host.
  ingress:
    enabled: false
    className: ""
    host: media.example.com
    annotations: {}
    tls:
      enabled: true
      secretName: ""
  # Option 2: a Cloudflare Tunnel, which needs no inbound port at all. Create
  # the tunnel in the Cloudflare dashboard, route its hostname to
  # http://<release>.<namespace>.svc and put its token in a Secret
  # (key: token).
  cloudflareTunnel:
    enabled: false
    tokenSecret: ""
    image:
      repository: cloudflare/cloudflared
      tag: "2026.11.2"

# Uploaded media lives here.
persistence:
  enabled: true
  size: 5Gi
  # Empty: the cluster's default StorageClass.
  storageClass: ""
  # Use a claim you manage instead.
  existingClaim: ""

oidc:
  # Any OpenID Connect provider. Register this redirect URI there:
  #   <publicUrl>/api/v1/auth/oidc/callback
  issuer: ""
  clientId: ""
  clientSecret: ""
  # Use a Secret you manage instead of clientSecret above (key: client-secret).
  existingSecret: ""
  name: SSO
  scopes: "openid profile email"
  # Lets the identity with this verified email sign in as an existing admin.
  allowedEmail: ""
  allowedSubject: ""

# The bundled database. Turn off and fill in externalDatabase to use your own.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
  auth:
    # Leave empty to have one generated and kept across upgrades. Tools that
    # only render templates (Argo CD) cannot keep it: set a password or an
    # existingSecret (key: password) there. Letters and digits only.
    password: ""
    existingSecret: ""
  persistence:
    size: 5Gi
    # Empty: the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

externalDatabase:
  # postgres://user:password@host:5432/dbname
  url: ""
  # Or a Secret you manage holding the URL.
  existingSecret: ""
  existingSecretKey: database-url

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # Empty: the cluster's default IngressClass.
  className: ""
  host: bmm.example.com
  annotations: {}
  tls:
    enabled: true
    # Empty: no secretName is set and the controller's default certificate
    # serves the host, which is what a wildcard-certificate setup wants.
    secretName: ""

networkPolicy:
  enabled: true
  # Who may reach the web port. Empty: any pod in the cluster, which is what
  # most ingress controllers need. Narrow it with standard `from` entries.
  ingressFrom: []

resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { memory: 768Mi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
