{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bmm.name" . }}-postgres
  labels: {{- include "bmm.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "bmm.selector" (dict "Release" .Release "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bmm.name" . }}-postgres
  labels: {{- include "bmm.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "bmm.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "bmm.selector" (dict "Release" .Release "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bmm.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bmm
            - name: POSTGRES_DB
              value: bmm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bmm.pgSecretName" . }}
                  key: password
          readinessProbe:
            exec:
              command: [pg_isready, -U, bmm, -d, bmm]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, bmm, -d, bmm]
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
