{{- if not .Values.config.secretKeyExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bmm.name" . }}-key
  labels: {{- include "bmm.labels" . | nindent 4 }}
  annotations:
    # Losing this key makes every stored network credential unreadable.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret-key: {{ include "bmm.secretKey" . | quote }}
---
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bmm.name" . }}-postgres
  labels: {{- include "bmm.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "bmm.pgPassword" . | quote }}
---
{{- end }}
{{- $needsAppSecret := or .Values.config.setupToken (and .Values.oidc.clientSecret (not .Values.oidc.existingSecret)) (and (not .Values.postgresql.enabled) .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret)) }}
{{- if $needsAppSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bmm.name" . }}
  labels: {{- include "bmm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.config.setupToken }}
  setup-token: {{ . | quote }}
  {{- end }}
  {{- if and .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
  client-secret: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret) }}
  database-url: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
