apiVersion: v1
kind: Service
metadata:
  name: {{ include "bmm.name" . }}
  labels: {{- include "bmm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "bmm.selector" (dict "Release" .Release "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
