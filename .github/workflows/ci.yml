name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  postgres:
    name: Runs on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bmm
          POSTGRES_PASSWORD: bmm
          POSTGRES_DB: bmm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmm -d bmm" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start BMM against Postgres and walk through it
        env:
          DATABASE_URL: postgres://bmm:bmm@localhost:5432/bmm
          BMM_WEB_DIR: ../web/dist
          BMM_UPDATE_CHECK: "false"
        run: |
          (cd apps/server && node dist/main.js > /tmp/bmm.log 2>&1 &)
          node scripts/smoke.mjs http://localhost:3000 --web || { cat /tmp/bmm.log; exit 1; }
      - name: Restart on the same database, which re-runs the migrator
        env:
          DATABASE_URL: postgres://bmm:bmm@localhost:5432/bmm
          BMM_PORT: 3001
          BMM_UPDATE_CHECK: "false"
        run: |
          (cd apps/server && node dist/main.js > /tmp/bmm2.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS localhost:3001/readyz && break || sleep 1; done
          test "$(curl -fsS localhost:3001/api/v1/auth/status | jq -r .setupRequired)" = "false" || { cat /tmp/bmm2.log; exit 1; }

  chart:
    name: Helm chart renders valid Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm lint deploy/helm/bmm
      - name: Render the default and the external-everything variants
        run: |
          mkdir -p rendered
          helm template bmm deploy/helm/bmm > rendered/default.yaml
          helm template bmm deploy/helm/bmm \
            --set ingress.enabled=true --set ingress.host=bmm.example.com \
            --set oidc.issuer=https://id.example.com --set oidc.clientId=bmm --set oidc.clientSecret=secret \
            --set config.passwordLogin=false \
            --set postgresql.enabled=false --set externalDatabase.url=postgres://u:p@db:5432/bmm \
            --set publicMedia.url=https://media.example.com --set publicMedia.ingress.enabled=true \
            --set publicMedia.cloudflareTunnel.enabled=true --set publicMedia.cloudflareTunnel.tokenSecret=tunnel \
            --set persistence.existingClaim=my-claim --set config.secretKeyExistingSecret=my-key \
            > rendered/external.yaml
      - name: Every label value is one Kubernetes accepts, even with build metadata in the version
        run: |
          helm package deploy/helm/bmm --version "1.2.3+0123456789ab" --app-version "1.2.3+0123456789ab" -d /tmp/chart
          helm template bmm /tmp/chart/bmm-1.2.3+0123456789ab.tgz > /tmp/plus.yaml
          grep -E '(helm\.sh/chart|app\.kubernetes\.io/version): ' /tmp/plus.yaml | sort | uniq -c
          grep -q 'helm.sh/chart: "bmm-1.2.3_0123456789ab"' /tmp/plus.yaml
          grep -q 'app.kubernetes.io/version: "1.2.3_0123456789ab"' /tmp/plus.yaml
          bad=$(grep -E '^\s+(app\.kubernetes\.io|helm\.sh)/[a-z-]+: ' /tmp/plus.yaml \
            | sed -E 's/^[^:]+: "?([^"]*)"?$/\1/' \
            | grep -vE '^([A-Za-z0-9]([A-Za-z0-9._-]{0,61}[A-Za-z0-9])?)?$' || true)
          if [ -n "$bad" ]; then echo "Illegal label values:"; echo "$bad"; exit 1; fi
      - name: Validate against the Kubernetes schemas
        run: >
          docker run --rm -v "$PWD/rendered:/rendered" ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary /rendered

  cluster:
    name: Installs and upgrades on Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bmm:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create a cluster and give it the image
        timeout-minutes: 6
        run: |
          kind create cluster --wait 120s
          kind load docker-image bmm:ci
      - name: Install the chart, packaged the way Flux delivers it
        run: |
          # Flux installs an OCI chart with the artifact digest appended to the
          # version. Only the API server rejects what that does to a label, so
          # the test installs exactly such a version.
          helm package deploy/helm/bmm --version "0.0.0+ci0123456789" --app-version ci -d /tmp/chart
          helm install bmm /tmp/chart/bmm-0.0.0+ci0123456789.tgz --namespace bmm --create-namespace \
            --set image.repository=bmm --set image.tag=ci --set image.pullPolicy=Never \
            --set config.updateCheck=false \
            --wait --timeout 5m
      - name: Walk through the installed instance
        run: |
          kubectl -n bmm port-forward svc/bmm 3000:80 > /tmp/pf.log 2>&1 &
          node scripts/smoke.mjs http://localhost:3000 --web
      - name: Upgrade in place and check that nothing was lost
        run: |
          helm upgrade bmm /tmp/chart/bmm-0.0.0+ci0123456789.tgz --namespace bmm \
            --set image.repository=bmm --set image.tag=ci --set image.pullPolicy=Never \
            --set config.updateCheck=false --set-string podAnnotations.upgraded=yes \
            --wait --timeout 5m
          pkill -f "port-forward svc/bmm" || true
          kubectl -n bmm port-forward svc/bmm 3002:80 > /tmp/pf2.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3002/readyz && break || sleep 1; done
          # The admin created before the upgrade is still there: the database
          # password was kept and the data volume survived.
          test "$(curl -fsS localhost:3002/api/v1/auth/status | jq -r .setupRequired)" = "false"
      - name: Show what happened
        if: failure()
        run: |
          kubectl -n bmm get all,pvc,networkpolicy
          kubectl -n bmm describe pods
          kubectl -n bmm logs deploy/bmm --tail=200 || true
          kubectl -n bmm logs statefulset/bmm-postgres --tail=100 || true
