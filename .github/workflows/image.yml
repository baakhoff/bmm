name: Image

# main publishes :edge, a v* tag publishes that version and :latest.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for it to answer
        run: |
          docker run -d --name bmm -p 3000:3000 "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/readyz; then
              curl -fsS localhost:3000/api/v1/auth/status
              curl -fsS -o /dev/null localhost:3000/login
              exit 0
            fi
            sleep 2
          done
          docker logs bmm
          exit 1
