packages:
  - apps/*
  - packages/*

# esbuild's install script only verifies its platform binary; the binary
# itself arrives as an optional dependency, so the script is not needed.
allowBuilds:
  esbuild: false

# drizzle-kit still pulls an old esbuild through a deprecated loader
# (GHSA-67mh-4wv8-2f99, development server only). Force the patched line.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"

# The image is built once and copied to every target architecture, so native
# packages (sharp) must be installed for all of them, not just the builder's.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64, arm64]
  libc: [current, musl]
